apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - "alertmanager.monitoring:9093"

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - "127.0.0.1:9090"
            labels:
              job: prometheus

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - "kube-state-metrics.monitoring:8080"

      - job_name: node-exporter
        static_configs:
          - targets:
              - "172.18.0.3:9100"
        relabel_configs:
          - action: replace
            replacement: node-exporter
            target_label: job

      - job_name: cAdvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        static_configs:
          - targets:
              - "172.18.0.3:10250"
        honor_labels: true
  rules.yml: |
    groups:
      - name: aiops-demo.rules
        interval: 15s
        rules:
          - alert: DemoAppCrashLoop
            expr: |
              increase(kube_pod_container_status_restarts_total{namespace="default", pod=~"leaky-app-.*"}[5m]) > 1
            for: 2m
            labels:
              severity: critical
              service: leaky-app
              namespace: default
            annotations:
              summary: leaky-app 频繁重启(CrashLoopBackOff)
              description: leaky-app Pod 在 5 分钟内重启多次，可能存在代码级内存泄漏或启动崩溃，需排查.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: quay.m.daocloud.io/prometheus/prometheus:v3.14.0-distroless
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - name: http-web
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: prometheus-config
            items:
              - key: prometheus.yml
                path: prometheus.yml
              - key: rules.yml
                path: rules.yml
        - name: storage
          emptyDir: {}
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  type: NodePort
  ports:
    - name: http-web
      port: 9090
      targetPort: 9090
      nodePort: 30900