server:
  port: 8081

spring:
  application:
    name: agent-platform

  datasource:
    # 统一走环境变量覆盖，避免真实密码被提交进版本库。
    # createDatabaseIfNotExist=true：库不存在时自动建，省掉手工建库这一步。
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/agent_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:your_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 注意：jpa 必须与 datasource 平级。
  # 之前 jpa 被缩进到 datasource 下面，导致整块配置失效、ddl-auto 不生效。
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  # 注意：data.redis 与 kafka 必须挂在 spring 下。
  # 之前它们被缩进到 jwt 下面，导致 Redis/Kafka 配置全部失效。
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: agent-group
      auto-offset-reset: earliest
      max-poll-records: 10
      properties:
        retry.backoff.ms: 1000
        reconnect.backoff.ms: 1000
        spring.json.trusted.packages: "*"

  # 已删除 spring.webflux.base-path: /api
  # 它会把整个 HTTP 管道包进 ContextPathCompositeHandler，导致所有 Controller
  # 实际变成 /api/api/xxx，而且 WebSocket 握手和 /actuator/health 会直接 404。

jwt:
  # HS256 要求密钥至少 256 bit（32 字节）。原值 your-256-bit-secret-for-jwt
  # 只有 27 字节，登录时会抛 WeakKeyException。生产环境请换成随机串。
  secret: opsagent-dev-secret-key-please-change-in-prod-32b
  expiration: 86400000

# 自定义配置
opsagent:
  internal:
    # Python agent 回调 /api/agent/callback/** 时必须携带 X-Internal-Token，
    # 与 aiops-agent/.env 的 JAVA_INTERNAL_TOKEN 保持一致。
    token: ${OPSAGENT_INTERNAL_TOKEN:dev-internal-token}
  agent:
    url: http://localhost:5000
    connect-timeout: 3000
    # /api/agent/start 改为立即返回 202，无需再等 30 秒
    read-timeout: 10000
  tools:
    # 允许 AI agent 调用的工具白名单。
    # generic_command（可执行任意 shell 命令）刻意不在其中：工具本身保留，
    # 仍会出现在 /api/tools/list 里，但不暴露给大模型。
    agent-exposed: restart_service,scale_up,query_log,get_status,rollback,clear_cache,request_human_approval,query_metrics,query_pod_events,query_impact
  approval:
    # auto：立即批准但落审计记录；manual：挂起等待外部审批（需要前端配合）
    mode: manual
  # 前瞻性增强一：指标基线学习 + 异常预警。
  # 周期采集各 Deployment 的 CPU/内存/重启次数，学习正常水位（均值±Nσ），
  # 偏离超阈值即生成「预测性预警」——此时 Prometheus 告警规则通常还没触发。
  anomaly:
    enabled: true
    interval-seconds: 60          # 采样周期
    sigma: 3.0                    # 偏离多少个标准差算异常
    consecutive-hits: 2           # 连续命中多少次才预警（过滤单点毛刺）
    cooldown-minutes: 30          # 同一服务同一指标的预警冷却
    window-samples: 60            # 滑动窗口保留的采样点数（60 点 × 60s = 1 小时基线）
    min-samples: 12               # 冷启动保护：样本少于该数不判定
    restart-delta-threshold: 3    # 重启次数单周期增量预警阈值
    # 噪声地板（占均值的百分比）：标准差小于该比例时抬到地板值，避免"稳到标准差近 0"
    # 的指标把正常抖动判成异常。内存设 2% —— 实测内存噪声 σ 仅占均值 0.01%~0.6%，
    # 而真实故障（leaky-app 内存涨 208%）差三个数量级，2% 能干净切分。
    # CPU 本身抖动比例就大（实测 12%~45%），地板必须设小，否则会压掉真实的 CPU 问题。
    memory-noise-floor-percent: 2.0
    cpu-noise-floor-percent: 0.5
  # 前瞻性增强二：服务拓扑（影响面分析的数据层）。
  topology:
    # 拓扑缓存秒数。告警爆发时同一 namespace 被反复查询，缓存挡掉大部分 apiserver 调用。
    cache-seconds: 60
  # 前瞻性增强三：修复后回归验证。
  # 「执行完」不等于「修好了」——成功后进入观察期，故障复现则改判 REGRESSED 并重新触发分析。
  recovery:
    enabled: true
    observe-minutes: 5            # 观察期总时长
    interval-seconds: 30          # 复查间隔
    failure-threshold: 2          # 连续失败多少次判定复现
  webhook:
    # Alertmanager Webhook 自身认证令牌：请求必须携带 X-Webhook-Token，
    # 与 Alertmanager 的 http_config.headers 配置保持一致。留空表示不校验（仅本地调试用）。
    token: ${OPSAGENT_WEBHOOK_TOKEN:dev-webhook-token}
    # 可选 HMAC 签名密钥：配置后要求请求携带 X-Signature 头。留空表示不启用。
    hmac:
      secret: ${OPSAGENT_WEBHOOK_HMAC_SECRET:}
    # 幂等去重：fingerprint = alertname + instance + severity，
    # Redis SETNX，TTL 内同一 fingerprint 不重复触发分析。
    idempotency:
      ttlMinutes: 5
    fingerprint-keys: alertname,instance,severity
    # 告警降噪：同一 Pod/服务的多条告警（alertname 不同）在窗口内只触发一次
    # agent 分析，后续告警照常落库但聚合进已有分析任务。0 = 关闭。
    correlation-window-minutes: 3
  log:
    # SSH 取日志失败时的本地降级目录，留空表示不降级
    local-dir: ""
    # journalctl 的 unit 名映射，%s 会替换成服务名
    unit-pattern: "%s"
  cache:
    # exec：进 Pod 执行清理命令；restart：重启等价清理；ssh：走 SSH 执行
    mode: exec
    clear-command: "rm -rf /tmp/app-cache/*"
  kubernetes:
    namespace: default
  prometheus:
    # kind 集群里的 Prometheus 通过 NodePort 或 port-forward 暴露；
    # Java 后端跑在宿主机上，所以默认走宿主机端口
    url: http://localhost:9090
  ssh:
    host: localhost
    port: 22
    username: root
    password: your_password

logging:
  level:
    com.opsagent: DEBUG
    io.fabric8.kubernetes: INFO

# Resilience4j 配置
resilience4j:
  retry:
    instances:
      agentCall:
        # 从 3 改成 1：agent 启动不是幂等操作，重试等于重复拉起整个 ReAct 循环
        maxAttempts: 1
        waitDuration: 2s
      toolExecution:
        # 从 3 改成 1：重启/扩缩容被重试就是线上事故
        maxAttempts: 1
        waitDuration: 1s
  circuitbreaker:
    instances:
      agentCall:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  bulkhead:
    instances:
      agentCall:
        maxConcurrentCalls: 5
        maxWaitDuration: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: agent-platform
  prometheus:
    metrics:
      export:
        enabled: true
