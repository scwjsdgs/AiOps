kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aiops
networking:
  # 固定 K8s API Server 本机端口，避免每次重建随机分配。
  # 用 16443 避开 Prometheus 默认的 9090，防止端口冲突。
  apiServerPort: 16443
nodes:
  - role: control-plane
    extraPortMappings:
      # Prometheus NodePort -> 宿主机 9090，让 Java 保持 localhost:9090 访问
      - containerPort: 30900
        hostPort: 9090
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Alertmanager NodePort -> 宿主机 9093，便于手工排查告警路由
      - containerPort: 30393
        hostPort: 9093
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Grafana NodePort -> 宿主机 30300（与 Service nodePort 一致）
      - containerPort: 30300
        hostPort: 30300
        listenAddress: "127.0.0.1"
        protocol: TCP